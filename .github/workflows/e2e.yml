name: E2E demo

# Recorre la demo pública como lo haría un reclutador. Corre cada mañana,
# después de la restauración nocturna (08:00 UTC), y a mano desde Actions.
on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL a probar'
        default: 'https://crmfarmacia.vercel.app'

jobs:
  recorrido:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: ${{ inputs.base_url || 'https://crmfarmacia.vercel.app' }}
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npm run e2e
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-report
        path: frontend/playwright-report
        retention-days: 7
